# Bug-fix keyword heuristic (Section 4.2). Whole-word, case-insensitive.
# excludes: spans removed before matching (applied in order); vetoes: messages that are never fixes.
# Generated from repocity/szz/bugfix.py defaults; edit here to experiment.
keywords:
- fix
- fixes
- fixed
- fixing
- bugfix
- bugfixes
- hotfix
- bug
- bugs
- defect
- defects
- error
- errors
- crash
- crashes
- crashed
- fault
- faults
- patch
- patched
- resolve
- resolves
- resolved
- regression
- 'issue #'
- npe
- nullpointerexception
- incorrect
- wrong
- broken
- workaround
excludes:
- \bfix(e[sd]|ing)?\s+(a\s+|the\s+|some\s+|all\s+|minor\s+|more\s+)?(pmd|checkstyle|spotbugs|findbugs|sonar\w*|errorprone|error[- ]prone|lint|eslint|tslint|jshint|jscs|prettier|compiler|javac|deprecations?|deprecated|raw\s?types?|generics?|static analysis|code\s?style|codestyle)(\s+(issues?|errors?|warnings?|violations?|complaints?|problems?|findings?))?\b
- \bfix(e[sd]|ing)?\s+(a\s+|the\s+|some\s+|all\s+|minor\s+|more\s+)?(?:(?!(?:crash|bug|error|wrong|regression|npe|fault|defect|leak|race|deadlock)\w*\b)\w+\s+)?warnings?\b
- \bfix(e[sd]|ing)?\s+(a\s+|the\s+|some\s+|all\s+|minor\s+|small\s+)?(?:(?!(?:crash|bug|error|wrong|regression|npe|fault|defect|leak|race|deadlock)\w*\b)\w+\s+)?(typos?|spelling|grammar|wording|whitespace|indent(ation)?|formatting|format|style|lint(ing)?|pep\s?8|flake8|mypy|typing|type hints?|annotations?|imports?)\b
- \bfix(e[sd]|ing)?\s+(a\s+|the\s+|some\s+|all\s+)?(?:(?!(?:crash|bug|error|wrong|regression|npe|fault|defect|leak|race|deadlock)\w*\b)\w+\s+)?(docs?|documentation|docstrings?|readme|changelog|changes|comments?|links?|urls?|examples?|tutorial|copyright|license|headers?|javadoc|jsdoc)\b
- \bfix(e[sd]|ing)?\s+(a\s+|the\s+)?(ci|build|travis|appveyor|github actions|workflow|tests? names?|coverage|release|version)\b
- \b(error|errors)\s+(messages?|handling|reporting|pages?)\b
- \bresolv(e|es|ed|ing)\s+(the\s+)?(merge\s+)?conflicts?\b
- \bpatch\s+(release|version|level)\b
vetoes:
- ^\s*(\((docs?|chore|style|ci|build|tests?|refactor|perf|release)\)|(docs?|chore|style|ci|build|tests?|refactor|perf|release)(\(.*?\))?!?:)
- ^\s*fix\((deps|deps-dev|dependencies)\)
- ^\s*(bump|update|upgrade)\s+\S+\s+(from|to)\s+v?\d
