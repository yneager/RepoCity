[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repocity"
version = "1.0.0"
description = "RepoCity: git history as a 3D city with file-level bug-risk prediction"
requires-python = ">=3.12"
# Exact pins live in requirements.txt / requirements-dev.txt (reproducibility).
dependencies = []

[tool.setuptools.packages.find]
include = ["repocity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*"]
